# vim:ft=kitty
## name: Matrix
## author: tú

foreground            #c8ffc8
background            #0d0f0d
selection_foreground  #0d0f0d
selection_background  #0f3a0f
url_color             #00ff41
cursor                #00ff41
cursor_text_color     #0d0f0d

# Tabs
active_tab_foreground   #0d0f0d
active_tab_background   #00ff41
inactive_tab_foreground #7abf7a
inactive_tab_background #0f1f0f

# Marcas
mark1_foreground #0d0f0d
mark1_background #00ff41

# ── Paleta ANSI 16 colores ──────────────────────────
# Negros → fondos Matrix
color0  #0a0f0a
color8  #1a331a

# Rojos → se conservan para errores
color1  #ff3333
color9  #ff6666

# Verdes → Matrix puro
color2  #00ff41
color10 #39ff14

# Amarillos → verde-amarillo
color3  #b8ff00
color11 #ccff33

# Azules → verde medio (no hay azul en Matrix)
color4  #00cc33
color12 #00ff41

# Magentas → verde suave
color5  #00e676
color13 #69ff69

# Cianes → verde-cyan
color6  #00ffcc
color14 #80ffd5

# Blancos → verde muy claro
color7  #c8ffc8
color15 #e8ffe8