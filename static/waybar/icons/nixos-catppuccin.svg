<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="32" height="32">
  <defs>
    <linearGradient id="nixgrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#b4befe"/>
    </linearGradient>
  </defs>
  <!--
    NixOS snowflake — 6 segmentos tipo "lambda" rotados 60° entre sí
    Fiel al logo oficial: cada brazo tiene cabeza de flecha doble + tallo
  -->
  <g fill="url(#nixgrad)" transform="translate(250,250)">

    <!-- Segmento 1: 0° -->
    <path transform="rotate(0)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

    <!-- Segmento 2: 60° -->
    <path transform="rotate(60)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

    <!-- Segmento 3: 120° -->
    <path transform="rotate(120)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

    <!-- Segmento 4: 180° -->
    <path transform="rotate(180)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

    <!-- Segmento 5: 240° -->
    <path transform="rotate(240)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

    <!-- Segmento 6: 300° -->
    <path transform="rotate(300)" d="
      M 0 -200
      L -30 -145
      L -68 -200
      L -105 -145
      L -30 -145
      L -30 -70
      L 30 -70
      L 30 -145
      L 105 -145
      L 68 -200
      L 30 -145
      Z
    "/>

  </g>
</svg>
