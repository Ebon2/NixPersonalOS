# -----------------------------------------------------
# Autostart — NixOS edition
# -----------------------------------------------------

# XDG portal para screen sharing
exec-once = ~/.config/hypr/scripts/xdg.sh

# Polkit (en NixOS generalmente es un servicio systemd,
# pero dejamos el fallback por si acaso)
exec-once = systemctl --user start polkit-gnome-authentication-agent-1 || \
            /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1

# Notificaciones
exec-once = dunst

# GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Idle / lock
exec-once = hypridle

# Portapapeles
exec-once = wl-paste --watch cliphist store

# Wallpaper — swww con transición suave
exec-once = awww-daemon
exec-once = sleep 1.5 && awww img ~/.config/hypr/wp.png \
            --transition-type grow \
            --transition-pos 0.5,0.5 \
            --transition-duration 2 \
            --transition-fps 60

# Waybar
#exec-once = ~/.config/waybar/launch.sh

# Network manager
exec-once = nm-applet --indicator

# Bluetooth
exec-once = blueman-applet

# Cursor
exec-once = hyprctl setcursor Qogir-dark 24

# DBus environment (necesario para xdg-desktop-portal)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Aplicaciones de inicio opcionales
