# =====================================================
# window.conf — Window Rules
# Hyprland 0.53+ sintaxis CORRECTA (wiki Feb 2026)
#
# Inline: windowrule = REGLA valor, match:class PATRON
# Block:  windowrule { name = ID; match:class = P; REGLA = val }
#         (name es obligatorio en block syntax)
#
# Se pueden combinar múltiples reglas en una línea:
# windowrule = match:class PATRON, float on, center on, size 800 600
# =====================================================


workspace = 1, persistent:true

# -------------------------------------------------------
# Spotify
# -------------------------------------------------------
windowrule {
    name = spotify-overlay-rule
    match:class = spotify
    float = on
    move = 12 53
    size = 862 1161
    opaque = on
    workspace = 1 silent
}

# -------------------------------------------------------
# WhatsApp
# -------------------------------------------------------
windowrule {
    name = wsp-overlay-rule
    match:class = com.rtosta.zapzap
    float = on
    move = 886 53
    size = 1662 1161
    opaque = on
    workspace = 1 silent
}

# -------------------------------------------------------
# Cava visualizer
# -------------------------------------------------------
windowrule {
    name = cava-overlay-rule
    match:class = cava-term
    # border = true
    float = on
    move = 14 1228
    size = 2158 358
    opaque = on
    workspace = 1 silent
    no_focus = true
}

# -------------------------------------------------------
# Clock widget
# -------------------------------------------------------
windowrule {
    name = clock-overlay-rule
    match:class = clock-term
    float = on
    move = 2188 1228
    size =  360 360
    opaque = on
    workspace = 1 silent
    no_focus = true
} 

# -------------------------------------------------------
# JetBrains / IDEs
# -------------------------------------------------------
windowrule {
    name = JetBrains-overlay-rule
    match:class =jetbrains-.*
    opaque = on
}
# -------------------------------------------------------
# VSCode
# -------------------------------------------------------
windowrule {
    name = VSCode-overlay-rule
    match:class = code
    opaque = on
}

# -------------------------------------------------------
# OBS
# -------------------------------------------------------
windowrule {
    name = OBS-overlay-rule
    match:class = com.obsproject.Studio
    opaque = on
    workspace = 9
}

# -------------------------------------------------------
# Cmatrix
# -------------------------------------------------------
windowrule {
    name = cmatrix-overlay-rule
    match:title = Matrix
    opaque = on
    border_size = 0
    fullscreen = true
}
# -------------------------------------------------------
# Xournal++
# -------------------------------------------------------
windowrule {
    name = Xournal-overlay-rule
    match:class = com.github.xournalpp.xournalpp
    opaque = on
    workspace = 8
}

# -------------------------------------------------------
# Diálogos flotantes genéricos
# -------------------------------------------------------
windowrule = match:title ^(Open File|Save File|Open Folder|Confirm|Alert|Authentication)(.*)$, float on