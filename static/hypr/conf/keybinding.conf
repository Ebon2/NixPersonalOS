# -----------------------------------------------------
# Key bindings
# -----------------------------------------------------

# SUPER KEY
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty  # Terminal (kitty)
bind = $mainMod, W, exec, zen-twilight # Browser (Firefox - zen-browser no está en NixOS)
bind = $mainMod, E, exec, dolphin  # File Explorer (Dolphin)
bind = $mainMod, C, exec, code  # VSCode
bind = $mainMod, T, exec, kitty --class clock-overlay -e clock-rs -t -s # Clock-rs 
bindr = $mainMod, T, exec, bash -c 'sleep 1.5 && pkill -f clock-rs' # Kill Clock-rs
bind = $mainMod, B, exec, brave # Brave
bind = $mainMod, O, exec, obsidian # Obsidian
bind = $mainMod, J, exec, jetbrains-toolbox #JetBrains
bind = $mainMod, L, exec, onlyoffice-desktopeditors # OnlyOffice

# Windows
bind = $mainMod, Q, killactive  # Kill active window
bind = $mainMod, F, fullscreen  # Set active window to fullscreen
bind = $mainMod CTRL, P, pseudo
bind = $mainMod SHIFT, F, togglefloating  # Toggle active windows into floating mode
bind = $mainMod, S, layoutmsg, togglesplit # Toggle split
bind = $mainMod CTRL, S, layoutmsg, swapsplit
bind = $mainMod, LEFT, movefocus, l # Move focus left
bind = $mainMod, RIGHT, movefocus, r  # Move focus right
bind = $mainMod, UP, movefocus, u # Move focus up
bind = $mainMod, DOWN, movefocus, d # Move focus down
bindm = $mainMod, mouse:272, movewindow # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with the mouse
bindel = $mainMod SHIFT, RIGHT, resizeactive, 100 0 # Increase window width with keyboard
bindel = $mainMod SHIFT, LEFT, resizeactive, -100 0 # Reduce window width with keyboard
bindel = $mainMod SHIFT, UP, resizeactive, 0 -100 # Increase window height with keyboard
bindel = $mainMod SHIFT, DOWN, resizeactive, 0 100 # Reduce window height with keyboard
bind = $mainMod, G, togglegroup # Toggle window group

# Actions
bind = , CTRL, exec, hyprctl --batch "keyword cursor:zoom_factor 2; keyword cursor:zoom_factor 1" # Gets big cursor

bind = , Print, exec, hyprshot -m active -m window --clipboard-only && swayosd-client --custom-message "Screenshot copiado" --custom-icon "camera-photo" # Takes a screenshot only of one window
bind = CTRL, Print, exec, hyprshot -m active -m window -o ~/Imágenes/Screenshots  # Takes a screenshot only of one window and save then

bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only && swayosd-client --custom-message "Screenshot copiado" --custom-icon "camera-photo" # Takes a screenshot of an area
bind = CTRL SHIFT, Print, exec, hyprshot -m region -o ~/Imágenes/Screenshots   # Takes a screenshot of an area and save then

bind = $mainMod, Print, exec, hyprshot -m active -m output --clipboard-only && swayosd-client --custom-message "Screenshot copiado" --custom-icon "camera-photo"# Takes a full screenshot
bind = $mainMod CTRL, Print, exec, hyprshot -m active -m output  -o ~/Imágenes/Screenshots  # Takes a full screenshot and save then	

bind = $mainMod, X, exec, ~/.config/wofi-power/power.sh # Run wofi
bind = $mainMod, code:133, exec, rofi -show drun -replace -i # Open application launcher (rofi-wayland)
bind = $mainMod CTRL, H, exec, ~/.config/hypr/scripts/keybindings.sh  # Show keybindings
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh  # Reload waybar
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/loadconfig.sh  # Reload hyprland config
bind = $mainMod CTRL, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy  # Open clipboard manager

# Workspaces
bind = $mainMod, 1, workspace, 1  # Open workspace 1
bind = $mainMod, 2, workspace, 2  # Open workspace 2
bind = $mainMod, 3, workspace, 3  # Open workspace 3
bind = $mainMod, 4, workspace, 4  # Open workspace 4
bind = $mainMod, 5, workspace, 5  # Open workspace 5
bind = $mainMod, 6, workspace, 6  # Open workspace 6
bind = $mainMod, 7, workspace, 7  # Open workspace 7
bind = $mainMod, 8, workspace, 8  # Open workspace 8
bind = $mainMod, 9, workspace, 9  # Open workspace 9
bind = $mainMod, 0, workspace, 10  # Open workspace 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1  # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2  # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3  # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4  # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5  # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6  # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7  # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8  # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9  # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move active window to workspace 10
bind = $mainMod, mouse_down, workspace, e+1 # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1  # Open previous workspace
bind = $mainMod CTRL, RIGHT, workspace, e+1 # Open next workspace
bind = $mainMod CTRL, LEFT, workspace, e-1  # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty  # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise # Increase brightness
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower # Reduce brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise # Increase volume
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower # Reduce volume
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle  # Toggle mute
bind = , XF86AudioPlay,  exec, swayosd-client --playerctl play-pause  # Audio play pause
bind = , XF86AudioPause, exec, swayosd-client --playerctl pause  # Audio pause
bind = , XF86AudioNext,  exec, swayosd-client --playerctl next  # Audio next
bind = , XF86AudioPrev,  exec, swayosd-client --playerctl prev  # Audio previous
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle  # Toggle mic
bind = , XF86Calculator, exec, qalculate-gtk  # Open calculator
bind = , XF86Lock, exec, hyprlock # Open screenlock
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock  # Caps Lock OSD

bindl = , Num_Lock, exec, sleep 0.1 && swayosd-client --num-lock # Num Lock OSD
# Resize tiling windows with CTRL+SUPER+drag
bindm = CTRL $mainMod, mouse:272, resizewindow
