# -----------------------------------------------------
# Decoration — Catppuccin Mocha glass aesthetic
# -----------------------------------------------------

decoration {
    rounding = 15

    blur {
        enabled           = true
        size              = 8
        passes            = 3
        new_optimizations = on
        ignore_opacity    = true
        xray              = false
        noise             = 0.02
        contrast          = 0.9
        brightness        = 0.8
        vibrancy          = 0.2
        vibrancy_darkness = 0.0
        popups            = true
        popups_ignorealpha = 0.2
    }

    # Transparencia — activa normal, inactiva con más transparencia
    active_opacity     = 0.96
    inactive_opacity   = 0.78
    fullscreen_opacity = 1.0

    # Sombras
    shadow {
    enabled        = true
    range          = 20
    render_power   = 3
    color          = rgba(0, 20, 5, 0.85) 
    color_inactive = rgba(0, 10, 2, 0.40)      
    }

    # Dim — refuerza el foco visual
    dim_inactive   = true
    dim_strength   = 0.12
    dim_special    = 0.4
    dim_around     = 0.5
}
