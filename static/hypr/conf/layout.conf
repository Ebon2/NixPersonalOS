# =====================================================
# layout.conf — Gaps, borders y layout settings
# Hyprland 0.53+
# =====================================================

general {
    gaps_in           = 6
    gaps_out          = 12
    border_size       = 2
    col.active_border   = rgba(00ff41ee) rgba(00cc33ee) 45deg
    col.inactive_border = rgba(1a331aaa)
    layout            = dwindle
    resize_on_border  = true
}

