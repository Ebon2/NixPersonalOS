# =====================================================
# layout.conf — Gaps, borders y layout settings
# Hyprland 0.53+
# =====================================================

general {
    gaps_in           = 6
    gaps_out          = 12
    border_size       = 2
    col.active_border   = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    layout            = dwindle
    resize_on_border  = true
}

dwindle {
    pseudotile    = true
    preserve_split = true
}
