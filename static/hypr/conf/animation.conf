# -----------------------------------------------------
# Animations — Catppuccin Mocha vibes ✨
# -----------------------------------------------------

animations {
    enabled = true

    # Bezier curves
    bezier = smoothOut,    0.36, 0, 0.66, -0.56
    bezier = smoothIn,     0.25, 1, 0.5,  1
    bezier = overshot,     0.05, 0.9, 0.1, 1.05
    bezier = linear,       1,    1,  1,   1
    bezier = easeInOut,    0.87, 0, 0.13, 1
    bezier = bounce,       0.34, 1.56, 0.64, 1

    # Windows
    animation = windows,        1, 5,  overshot, slide
    animation = windowsIn,      1, 5,  bounce,   popin 70%
    animation = windowsOut,     1, 4,  smoothOut, popin 80%
    animation = windowsMove,    1, 4,  easeInOut

    # Borders
    animation = border,         1, 10, default
    animation = borderangle,    1, 180, linear, loop

    # Fade
    animation = fade,           1, 5,  smoothIn
    animation = fadeIn,         1, 5,  smoothIn
    animation = fadeOut,        1, 4,  smoothOut
    animation = fadeDim,        1, 5,  easeInOut
    animation = fadeShadow,     1, 5,  smoothIn
    animation = fadeSwitch,     1, 5,  easeInOut
    animation = fadeLayers,     1, 5,  smoothIn

    # Workspaces
    animation = workspaces,     1, 5,  easeInOut, slidevert
    animation = specialWorkspace, 1, 4, overshot, slidefadevert 30%
}
